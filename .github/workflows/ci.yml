name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run backend tests
      run: npm run backend:test

    - name: Test panel access policy
      run: npm run backend:test:panel

    - name: Test frontend
      run: npm run frontend:test -- --runInBand

    - name: Check backend sources
      run: npm run backend:build

    - name: Build frontend
      run: npm run build
